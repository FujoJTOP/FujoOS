name: fujoci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qemu-log-assert:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (clang/lld/llvm-readobj)
        shell: pwsh
        run: |
          choco install llvm --yes
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install QEMU
        shell: pwsh
        run: choco install qemu --yes
      - name: Build kernel (release)
        shell: pwsh
        run: |
          Set-Location kernel
          cargo build --release
      - name: Flatten
        shell: pwsh
        run: python tools/flatten_elf.py kernel/target/x86_64-unknown-none/release/fujo-kernel kernel/fujo-kernel.bin --pad 0x1A0000
      - name: Run fujoci (QEMU headless + log assert)
        shell: pwsh
        run: python tools/ci.py --json ci-results.json
      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fujoci-results
          path: ci-results.json
